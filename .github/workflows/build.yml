name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Build
        run: cp -rf .github/workflows/Dockerfile . && docker build -t hyperf .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start stack
        run: |
          docker compose build
          docker compose up -d --wait

      - name: Install dependencies
        run: docker compose exec -T -u 1000:1000 hyperf-skeleton composer install --no-interaction

      - name: Migrate
        run: docker compose exec -T -u 1000:1000 hyperf-skeleton php bin/hyperf.php migrate --force

      - name: Run full gate
        run: make gate-full
